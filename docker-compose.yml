version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: foodlink-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-foodlink}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - foodlink-mysql-data:/var/lib/mysql

volumes:
  foodlink-mysql-data:
